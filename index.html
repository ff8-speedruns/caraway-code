    <meta name="description" content="Alternate site for the FF8 Caraway code and pole skip manip." />
    <title>FF8 Caraway Code / Pole Skip</title>
    <script>
      // Resolve the saved colour scheme before first paint. Shared key, so the
      // choice carries over from the hub. See @ff8-speedruns/ui.
      try {
        var s = window.localStorage.getItem('ff8-color-scheme');
        var scheme = s === 'light' || s === 'dark' || s === 'auto' ? s : 'auto';
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        );
      } catch (e) {}
    </script>
